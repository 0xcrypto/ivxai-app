# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

# Tag a version to publish. One draft release holds, for each of the three
# desktop platforms, the app and the standalone bridge.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to publish
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  # Created first so every build job has somewhere to upload to, and so the
  # notes are written once rather than raced for by whichever job lands last.
  draft:
    name: draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ten seconds here beats discovering after three platform builds that the
      # artefacts are named for a version the app does not report.
      - name: Check the tag matches the version
        run: node scripts/version.mjs --check "$TAG"

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            ## Install

            | You want | Download |
            | --- | --- |
            | Just the CORS bypass, no app | `ivx-bridge-*` for your platform |
            | macOS | `*-macos-universal.dmg`, or the `.app.tar.gz` |
            | Windows | `*-windows-x86_64-setup.exe` |
            | Linux | `*.AppImage` or `*.deb` |

            ### A note on signing

            These builds are not notarised and carry no paid developer
            certificate, so each platform will want convincing:

            - **macOS** — Gatekeeper refuses it on first launch. Right-click the
              app and choose Open, or run
              `xattr -dr com.apple.quarantine "/Applications/ivxai Chat.app"`.
            - **Windows** — SmartScreen shows "Windows protected your PC".
              More info → Run anyway.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploads will be added to it."
            exit 0
          fi
          printf '%s' "$NOTES" > notes.md
          gh release create "$TAG" --draft --title "ivx/ai Chat $TAG" --notes-file notes.md

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal, so one download covers Apple Silicon and Intel.
          - { os: macos-latest,   name: macos-universal, rust_targets: 'aarch64-apple-darwin x86_64-apple-darwin' }
          - { os: windows-latest, name: windows-x86_64,  rust_targets: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest,  name: linux-x86_64,    rust_targets: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Tauri's Linux prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      # Two explicit installs rather than letting the root postinstall run
      # `npm --prefix web install`. That nests one npm inside another's
      # lifecycle script, and on Windows the inner install fails while the outer
      # still holds the tree open, so even the rollback dies with EPERM.
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: web

      # Each platform stages its finished, correctly named files in dist/.

      # The bridge ships on its own too, for people who want the CORS bypass
      # without the app. Same crate the app embeds, built as a binary.
      - name: Bridge (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -eu
          cargo build --release -p ivx-bridge --target aarch64-apple-darwin
          cargo build --release -p ivx-bridge --target x86_64-apple-darwin
          mkdir -p dist bridge
          cp README.md LICENSE bridge/
          lipo -create -output bridge/ivx-bridge \
            target/aarch64-apple-darwin/release/ivx-bridge \
            target/x86_64-apple-darwin/release/ivx-bridge
          tar -czf "dist/ivx-bridge-$TAG-macos-universal.tar.gz" -C bridge .

      - name: Bridge (Windows and Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          set -eu
          cargo build --release -p ivx-bridge --target ${{ matrix.rust_targets }}
          mkdir -p dist bridge
          cp README.md LICENSE bridge/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.rust_targets }}/release/ivx-bridge.exe bridge/
          else
            cp target/${{ matrix.rust_targets }}/release/ivx-bridge bridge/
          fi
          tar -czf "dist/ivx-bridge-$TAG-${{ matrix.name }}.tar.gz" -C bridge .

      # Bundles land in the workspace target/, not src-tauri/target/.
      - name: App (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -eu
          BUNDLE=target/universal-apple-darwin/release/bundle
          npx tauri build --target universal-apple-darwin --bundles app
          # productName has spaces in it, so take whatever .app was produced
          # rather than hardcoding a name that drifts when the app is renamed.
          APP=$(cd "$BUNDLE/macos" && ls -d *.app | head -1)
          tar -C "$BUNDLE/macos" -czf "dist/ivxai-chat-$TAG-macos-universal.app.tar.gz" "$APP"

          # The .dmg step drives Finder over AppleScript to lay its window out,
          # which is the one part of a macOS bundle that can fail on a runner
          # with no desktop session. The .app above is the real deliverable, so
          # a dmg failure must not take the release down with it.
          if npx tauri build --target universal-apple-darwin --bundles dmg; then
            cp "$BUNDLE"/dmg/*.dmg "dist/ivxai-chat-$TAG-macos-universal.dmg"
          else
            echo "::warning::dmg bundling failed; shipping the .app only"
          fi

      - name: App (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -eu
          npx tauri build --bundles nsis
          cp target/release/bundle/nsis/*-setup.exe "dist/ivxai-chat-$TAG-windows-x86_64-setup.exe"

      - name: App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -eu
          npx tauri build --bundles appimage,deb
          cp target/release/bundle/appimage/*.AppImage "dist/ivxai-chat-$TAG-linux-x86_64.AppImage"
          cp target/release/bundle/deb/*.deb "dist/ivxai-chat-$TAG-linux-x86_64.deb"

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A silently empty upload is how a broken release goes unnoticed.
          [ -n "$(ls -A dist)" ] || { echo "nothing was built"; exit 1; }
          gh release upload "$TAG" dist/* --clobber
