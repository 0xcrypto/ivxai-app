name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  bridge:
    name: bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The bridge crate does not need the UI, so this job skips the submodule
      # and stays fast.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy -p ivx-bridge --all-targets -- -D warnings
      - run: cargo test -p ivx-bridge
      - run: cargo build --release -p ivx-bridge

  app:
    name: desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri's Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: npm install
      # --no-bundle: this job is here to prove it compiles and that the web
      # submodule still builds, not to produce installers.
      - run: npx tauri build --no-bundle

  android:
    name: android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - run: npm install
      # Same generate-then-overlay dance as the release build; gen/android is
      # not committed. See scripts/android-overlay.mjs.
      - run: npx tauri android init --ci
      - run: node scripts/android-overlay.mjs
      # One ABI, not all four: this job exists to prove the Android target still
      # compiles and that the overlay still applies. The release builds universal.
      - run: npx tauri android build --apk --target aarch64
