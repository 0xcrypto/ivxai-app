<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later | Copyright (C) 2026 0xcrypto -->
<html lang="en" data-bs-theme="dark" data-bs-core="modern">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- Everything executable comes from this origin. connect-src must stay open:
     it is how your own provider endpoints are reached. frame-ancestors is
     header-only, so serve it from your web server if you need it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src *; form-action 'self'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>ivxai Chat</title>
<meta name="description" content="A private, offline-first AI chat client for local and hosted models. Your keys and conversations never leave your browser.">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<div class="app">

  <!-- ── Drawer: conversations ───────────────────────────────── -->
  <aside id="drawer" class="drawer" aria-label="Conversations">
    <header class="drawer-head">
      <span class="brand"><span class="brand-mark">ivxai</span><span class="brand-sub">Chat</span></span>
      <button id="btnCloseDrawer" class="icon-btn" type="button" aria-label="Close">&#10005;</button>
    </header>

    <div class="drawer-search">
      <input id="convSearch" class="form-control" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
    </div>

    <nav id="convList" class="conv-list" aria-label="Conversations"></nav>

    <footer class="drawer-foot">
      <button id="btnSettings" class="foot-btn" type="button">
        <span class="foot-icon" aria-hidden="true">&#9881;</span> Settings
      </button>
    </footer>
  </aside>
  <div id="scrim" class="scrim"></div>

  <!-- ── Chat ────────────────────────────────────────────────── -->
  <main class="main">
    <header class="topbar">
      <button id="btnMenu" class="icon-btn" type="button" aria-label="Chats">&#9776;</button>
      <h1 id="convTitle" class="topbar-title">New chat</h1>
      <button id="btnNewChat" class="icon-btn" type="button" aria-label="New chat" title="New chat">&#43;</button>
      <button id="btnChatMenu" class="icon-btn" type="button" aria-label="Chat actions" title="Chat actions">&#8943;</button>
    </header>

    <div id="messages" class="messages" tabindex="-1"></div>

    <div id="jump" class="jump" hidden>
      <button id="btnJump" class="jump-btn" type="button" aria-label="Jump to latest">&#8595;</button>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <div class="composer-top">
        <button id="modelChip" class="chip" type="button" aria-haspopup="dialog">
          <span id="chipText" class="chip-text">No provider</span>
          <span class="chip-caret" aria-hidden="true">&#9662;</span>
        </button>
      </div>
      <div class="composer-row">
        <textarea id="input" class="composer-input" rows="1" placeholder="Message" aria-label="Message"></textarea>
        <button id="btnSend" class="send-btn" type="submit" aria-label="Send">&#8593;</button>
        <button id="btnStop" class="send-btn send-stop" type="button" aria-label="Stop generating" hidden>&#9632;</button>
      </div>
      <p id="statusLine" class="status">AI can make mistakes. <button id="btnDisclaimer" class="status-link" type="button">Read this to understand how your data is processed</button></p>
    </form>
  </main>
</div>

<!-- ── Bottom sheet: every panel in the app lives here ───────── -->
<div id="sheetHost" class="sheet-host" hidden>
  <div class="sheet-scrim" data-sheet-close></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <header class="sheet-head">
      <button id="sheetBack" class="icon-btn" type="button" aria-label="Back" hidden>&#8249;</button>
      <h2 id="sheetTitle" class="sheet-title">Sheet</h2>
      <button id="sheetClose" class="icon-btn" type="button" aria-label="Close" data-sheet-close>&#10005;</button>
    </header>
    <div id="sheetBody" class="sheet-body"></div>
  </section>
</div>

<div id="snacks" class="snacks" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
